[build]
  publish = "."

[[headers]]
  for = "/data/galleries.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Old Netlify subdomain → custom domain, so Google consolidates on one address
[[redirects]]
  from = "https://nyc-gallery-app.netlify.app/*"
  to = "https://nycgallerytracker.com/:splat"
  status = 301
  force = true

# Internal notes live in the repo but shouldn't be served on the site
[[redirects]]
  from = "/PROJECT_NOTES.md"
  to = "/404"
  status = 404
  force = true
